name: CEVE Validation + DevTracker Report

# Supply-chain (Fas 2.14a): every uses: is pinned to a full 40-hex commit SHA
# (the trailing # vN is the human-readable version). .github/dependabot.yml
# opens PRs to bump them — never replace a SHA with a floating tag.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pytest:
    name: Behavioral gate (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install runtime + test deps
        # Fas 2.14a — pytest + httpx are declared in pyproject.toml, so the
        # editable install below pulls them in; no bare, unpinned named-package
        # install here. The hashed --require-hashes install lands in 2.14b.
        run: pip install -e .

      - name: Run behavioral test suite
        # tests/ are auto-generated by Forseti from karta.yaml. The
        # smoke suite (tests/integration_tests/) validates that every
        # node is reachable and returns 200; per-node tests validate
        # that each handler honors its declared input/output schema.
        # Fas 2.24b — strict contracts are the runtime default; CI pins
        # the flag EXPLICITLY so this gate cannot silently weaken.
        env:
          DOER_STRICT_CONTRACTS: "1"
        run: pytest tests/ -v --tb=short

  ceve:
    name: H1–H13 doctrine validator + DevTracker push
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Verify agent identity (HexaID)
        # Identity by construction — recompute provenance_hash from
        # karta.compiled.json, verify the Ed25519 signature against
        # generator.pub, and check the HexaBox root-chain. Zero-dep (Python
        # stdlib only). Fails the gate on tamper / invalid signature, so a
        # modified bundle cannot pass its own CI.
        run: python verify_identity.py .

      - name: Install
        run: pip install -e .

      - name: Run CEVE-Light validator
        run: python validator/engine.py

      - name: Comment validator output on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            try {
              const report = fs.readFileSync('validator/report.txt', 'utf8');
              const body = ['## 🛡️ CEVE validator report', '', '```', report, '```'].join('\n');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } catch (e) {
              console.warn('No validator report to post:', e.message);
            }

      - name: Post CEVE result to HexaBox DevTracker
        if: always()
        env:
          DOABLE_DEVTRACKER_TOKEN: ${{ secrets.DOABLE_DEVTRACKER_TOKEN }}
          AGENT_ID: "a1c20f68-56dc-4dda-b667-7875c42e70d2"
          ENDPOINT: "https://hexabox-vault.lovable.app/functions/v1/devtracker-ceve-ingest"
        run: |
          if [ -z "$DOABLE_DEVTRACKER_TOKEN" ]; then
            echo "::warning::DOABLE_DEVTRACKER_TOKEN not set — skipping DevTracker push. See docs/dev-tracker-integration.md."
            exit 0
          fi
          if [ ! -f reports/ceve_validation.json ]; then
            echo "::warning::reports/ceve_validation.json missing — validator did not produce report."
            exit 0
          fi
          # Build flat payload (agent_id + commit merged into validation result)
          PAYLOAD=$(jq --arg aid "$AGENT_ID" --arg commit "$GITHUB_SHA" \
            '. + {agent_id: $aid, commit: $commit, triggered_by: "ci"}' \
            reports/ceve_validation.json)
          curl -X POST "$ENDPOINT" \
            -H "Authorization: Bearer $DOABLE_DEVTRACKER_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            -w "HTTP %{http_code}\n" \
            --fail-with-body
