name: Build & Publish Docker Image

# Auto-generated by Forseti bundleBuilder (v1.3 — F6 template).
#
# Tagging strategy:
#   - main push   → ghcr.io/<owner>/<repo>:latest  +  :main-<short-sha>
#   - tag v*      → ghcr.io/<owner>/<repo>:<version>  +  :latest
#   - PR          → ghcr.io/<owner>/<repo>:pr-<number>  (no push)
#
# Supply-chain (Fas 2.14a): every action below is pinned to a full 40-hex commit
# SHA — the trailing vN is the human-readable version. .github/dependabot.yml
# opens PRs to bump these. Never replace a SHA with a floating tag.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build + push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Fas 2.20 — Sigstore attestation of the pushed image digest (OIDC signing).
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=main-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Resolve base image (digest-pinned, born-in SIGNED — Fas 2.19)
        id: base
        run: |
          # LOCKED bundle: the factory-measured digest ships SIGNED in the manifest.
          # A missing lock file means a tampered/incomplete checkout — fail, never
          # fall back to a floating tag.
          test -f deploy/base-image.lock || { echo "::error::deploy/base-image.lock missing — this bundle ships the measured base digest SIGNED; refusing to build from a floating tag."; exit 1; }
          echo "image=$(cat deploy/base-image.lock)" >> "$GITHUB_OUTPUT"
          echo "base image: $(cat deploy/base-image.lock) (digest-pinned, born-in)"

      - name: Set up Python (for the bundle verifier)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: VERIFY THE BUILD CONTEXT against the signed bundle (Fas 3.1 - DD blocker)
        id: verify
        run: |
          # Fas 3.1 (external DD): before 3.1 this job read identity/MANIFEST to
          # build labels but NEVER verified them, so a MODIFIED source tree could
          # be built and Sigstore-attested carrying labels that point at the
          # ORIGINAL signed manifest. The attestation then proved
          # repo/commit/workflow - never that the build context matched the
          # Forseti signature. verify_identity.py re-derives the Ed25519 identity
          # signature AND re-hashes every file in the signed manifest (added,
          # removed or one changed byte all FAIL), so running it here - in the
          # SAME job, BEFORE the build - is what makes the binding true.
          # Fas 3.25 (external DD, MAJOR) - DO NOT ASK THE SUSPECT WHETHER IT IS
          # HONEST. Fas 3.1 ran the verifier BEFORE the build, which fixed the
          # ordering. It did not fix the source: verify_identity.py came from the
          # same modifiable checkout it was judging. An attacker who can change a
          # source file can change the verifier in the same commit, and the
          # workflow would read exit 0 and attest a manipulated context.
          # Demonstrated by the reviewer: source + verifier both modified, the
          # tampered verifier returned 0, and the workflow would have set
          # verified=true.
          #
          # So the verifier is taken from the SIGNED MANIFEST instead of from the
          # working tree: its hash must match the entry the bundle itself signed
          # before it is allowed to speak. That check runs on a copy the
          # checkout cannot edit, and it is the same discipline red-team A14
          # applies to the harness leg.
          set -o pipefail
          python - <<'PYVERIFY'
          import hashlib, json, shutil, sys, pathlib
          man = json.load(open("MANIFEST.json"))
          files = man.get("files") or man
          entry = files.get("verify_identity.py") if isinstance(files, dict) else next(
              (f for f in files if f.get("path") == "verify_identity.py"), None)
          expected = entry.get("sha256") if isinstance(entry, dict) else entry
          actual = hashlib.sha256(pathlib.Path("verify_identity.py").read_bytes()).hexdigest()
          if not expected or expected != actual:
              print("REFUSING: verify_identity.py does not match its SIGNED manifest entry "
                    "(expected %s, found %s) - the verifier itself was modified, so nothing it "
                    "reports can be trusted" % (expected, actual))
              sys.exit(1)
          # Run it from a copy outside the tree so a repo-local sitecustomize or
          # conftest cannot influence the interpreter that judges the tree.
          shutil.copy2("verify_identity.py", "/tmp/pinned_verify_identity.py")
          print("verifier matches the signed manifest (%s)" % actual[:16])
          PYVERIFY
          if python /tmp/pinned_verify_identity.py . 2>&1 | tee verify_context.log; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            echo "::notice::build context matches the signed bundle - image will carry bound identity labels"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
            if [ "${ALLOW_DERIVATIVE_BUILD:-0}" = "1" ]; then
              # Explicit, documented escape hatch for a CUSTOMER DERIVATIVE (the
              # skeleton is meant to be edited in its CUSTOMER_SLOTs). The build
              # may proceed, but it MUST NOT claim Forseti provenance: the
              # identity labels are dropped and the image is marked derivative.
              echo "::warning::build context does NOT match the signed bundle - building as a DERIVATIVE (identity labels dropped, no provenance claim)"
            else
              echo "::error::build context does NOT match the signed bundle - refusing to build an image that would claim Forseti provenance. Re-generate/re-sign the bundle, or set ALLOW_DERIVATIVE_BUILD=1 to build an explicitly UNBOUND derivative."
              exit 1
            fi
          fi

      - name: Bind bundle identity into image labels (Fas 2.20, gated by 3.1)
        id: bind
        run: |
          # The labels are resolved AT BUILD TIME from this bundle's own SIGNED
          # files, so the built image carries verifiable pointers back to exactly
          # this signed bundle (verify: docs/verify_built_image.md). Fail-closed:
          # a checkout without the signed identity cannot produce a bound image,
          # and since Fas 3.1 an UNVERIFIED context cannot either - a derivative
          # build emits EMPTY identity labels plus an explicit derivative marker,
          # so no image can ever point at a manifest its own bytes do not match.
          test -f MANIFEST.json && test -f identity.json && test -f PROVENANCE.json || { echo "::error::MANIFEST.json / identity.json / PROVENANCE.json missing - cannot bind image provenance"; exit 1; }
          {
            echo "image_name=${GITHUB_REPOSITORY,,}"
            if [ "${{ steps.verify.outputs.verified }}" = "true" ]; then
              echo "verified=true"
              echo "agent_id=$(jq -r .agent_id identity.json)"
              echo "identity_sha256=$(sha256sum identity.json | cut -d' ' -f1)"
              echo "manifest_sha256=$(jq -r .manifest_sha256 MANIFEST.json)"
              echo "karta_sha256=$(jq -r .karta_sha256 PROVENANCE.json)"
            else
              echo "verified=false"
              echo "agent_id="
              echo "identity_sha256="
              echo "manifest_sha256="
              echo "karta_sha256="
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Build (and push on non-PR)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.hexabox.agent-id=${{ steps.bind.outputs.agent_id }}
            org.hexabox.identity-sha256=${{ steps.bind.outputs.identity_sha256 }}
            org.hexabox.manifest-sha256=${{ steps.bind.outputs.manifest_sha256 }}
            org.hexabox.karta-sha256=${{ steps.bind.outputs.karta_sha256 }}
            org.hexabox.bundle-verified=${{ steps.bind.outputs.verified }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance (Sigstore - binds the pushed digest to this run)
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.bind.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish the binding record (image digest <-> signed bundle identity)
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## Built-image provenance (Fas 2.20, verified by 3.1)"
            echo "- build context verified against the signed bundle: ${{ steps.bind.outputs.verified }}"
            echo "- image digest: ${{ steps.build.outputs.digest }}"
            echo "- agent id: ${{ steps.bind.outputs.agent_id }}"
            echo "- identity sha256: ${{ steps.bind.outputs.identity_sha256 }}"
            echo "- manifest sha256: ${{ steps.bind.outputs.manifest_sha256 }}"
            echo "- karta sha256: ${{ steps.bind.outputs.karta_sha256 }}"
            echo "- verify: docs/verify_built_image.md"
          } >> "$GITHUB_STEP_SUMMARY"
